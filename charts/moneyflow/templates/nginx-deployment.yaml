apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneyflow-nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      app: moneyflow-nginx
  template:
    metadata:
      labels:
        app: moneyflow-nginx
    spec:
      initContainers:
        - name: copy-public
          image: {{ .Values.app.image }}
          command:
            - sh
            - -c
            - cp -a /app/public/. /shared-public/
          volumeMounts:
            - name: public-files
              mountPath: /shared-public

      containers:
        - name: nginx
          image: {{ .Values.nginx.image }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: public-files
              mountPath: /usr/share/nginx/html

      volumes:
        - name: nginx-config
          configMap:
            name: moneyflow-nginx-config

        - name: public-files
          emptyDir: {}
